<title>Schmear &amp; Schmooze — 4 Directions</title>

<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=DM+Serif+Display:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Caveat:wght@500;600;700&family=Anton&family=Oswald:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Bagel+Fat+One&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  /* phone frame shared */
  .phone {
    position: relative;
    width: 320px;
    height: 640px;
    border-radius: 38px;
    background: #111;
    padding: 10px;
    box-shadow: 0 14px 38px rgba(40,30,20,0.18), 0 2px 0 rgba(0,0,0,0.06);
    box-sizing: border-box;
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
  }
  .phone-notch {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 92px; height: 22px; background: #111; border-radius: 14px; z-index: 10;
    pointer-events: none;
  }
  /* status bar */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 38px;
    display:flex; align-items:center; justify-content: space-between;
    padding: 0 22px 0 26px; font-size: 13px; font-weight: 600; z-index: 9;
    pointer-events: none;
  }
  .statusbar .time { letter-spacing: 0.2px; }
  .statusbar .right { display:flex; gap:6px; align-items:center; }
  .statusbar .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .statusbar .battery { width: 22px; height: 11px; border-radius: 3px; border: 1.2px solid currentColor; position: relative; }
  .statusbar .battery::after { content:""; position:absolute; inset: 1.5px; right: 5px; background: currentColor; border-radius: 1px; }
  .statusbar .battery::before { content:""; position:absolute; right:-3px; top: 3px; bottom: 3px; width: 1.5px; background: currentColor; border-radius: 0 1.5px 1.5px 0; }

  /* TV / desktop leaderboard frame (used by some directions) */
  .tv {
    width: 760px;
    height: 460px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: #000;
    box-shadow: 0 14px 38px rgba(40,30,20,0.18);
  }

  /* Meta card */
  .meta-card {
    width: 300px;
    height: 640px;
    border-radius: 18px;
    background: #fff;
    padding: 22px;
    box-sizing: border-box;
    box-shadow: 0 6px 18px rgba(40,30,20,0.08);
    overflow: hidden;
    display: flex; flex-direction: column; gap: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #2a251f;
  }
  .meta-card h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  .meta-card .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(40,30,20,0.5); }
  .meta-card h3 { margin: 0 0 6px 0; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(40,30,20,0.55); }
  .meta-card p { margin: 0; font-size: 13px; line-height: 1.45; color: rgba(40,30,20,0.85); }
  .swatch-row { display: flex; gap: 6px; }
  .swatch { flex: 1; height: 36px; border-radius: 6px; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .swatch span { position: absolute; bottom: -16px; left: 0; font-size: 9px; font-family: ui-monospace, "SF Mono", monospace; color: rgba(40,30,20,0.5); }
  .swatch-grid { display: flex; flex-direction: column; gap: 22px; }
  .type-line { display: flex; flex-direction: column; gap: 2px; }
  .type-line .name { font-size: 11px; color: rgba(40,30,20,0.55); font-family: ui-monospace, "SF Mono", monospace; }
  .signature-box { background: #f6f4ef; border-radius: 10px; padding: 12px; font-size: 12px; line-height: 1.45; color: rgba(40,30,20,0.85); }
  .signature-box .label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(40,30,20,0.5); margin-bottom: 4px; }
</style>
</head>
